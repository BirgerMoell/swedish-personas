<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona review</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #deddd6;
    --accent: #2d5be3; --good: #1f8a4c; --ok: #b7791f; --bad: #c0392b; --flag: #fff3cd; --flag-line: #e0b84d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a998f; --line: #34332f;
      --accent: #7c9bff; --good: #4cc27f; --ok: #e0a93e; --bad: #ef6b5b; --flag: #3a3216; --flag-line: #8a7326;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header.bar .grow { flex: 1; }
  button, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  h1 { font-size: 1.35rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .82rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  .field { border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; margin: 6px -10px; position: relative; }
  .field.flagged, .task.flagged { background: var(--flag); border-color: var(--flag-line); }
  .field h3 { margin: 0 0 2px; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
  .field p { margin: 0; white-space: pre-wrap; }
  .flagbtn { font-size: .78rem; padding: 0 8px; border-radius: 6px; color: var(--muted); }
  .flagged .flagbtn { background: var(--flag-line); color: #000; border-color: var(--flag-line); }
  h2 { font-size: 1rem; margin: 14px 0 6px; }
  .lists { color: var(--muted); font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  td { padding: 6px 6px; vertical-align: top; border-top: 1px solid var(--line); }
  td.num { width: 3.2rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  td.tag { width: 4.2rem; color: var(--muted); font-size: .8rem; }
  tr.task.flagged td { background: var(--flag); }
  .detail { color: var(--muted); }
  details { margin-top: 8px; }
  details summary { cursor: pointer; color: var(--accent); }
  aside { position: sticky; top: 64px; display: grid; gap: 12px; }
  aside h2 { margin-top: 0; }
  .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .verdicts button { padding: 10px 4px; font-weight: 600; }
  .verdicts button.sel[data-v="good"] { background: var(--good); border-color: var(--good); color: #fff; }
  .verdicts button.sel[data-v="ok"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .verdicts button.sel[data-v="bad"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  textarea { width: 100%; min-height: 90px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .words .chip { color: var(--ink); background: var(--flag); border-color: var(--flag-line); cursor: pointer; }
  .status { color: var(--muted); font-size: .82rem; min-height: 1.2em; }
  .hint { color: var(--muted); font-size: .8rem; }
  .summary table td { padding: 4px 6px; }
  kbd { font: .75rem ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
<header class="bar">
  <button id="prev" title="Previous (←)">←</button>
  <button id="next" title="Next (→)">→</button>
  <span id="pos"></span>
  <select id="filter" title="Which personas to show">
    <option value="all">All</option>
    <option value="unreviewed">Not reviewed yet</option>
    <option value="reviewed">Reviewed</option>
    <option value="attention">Marked ok or bad</option>
    <option value="working">Working people</option>
    <option value="foreign">Foreign background</option>
    <option value="child">Under 18</option>
    <option value="senior">65 or older</option>
  </select>
  <button id="nextnew" title="Next one not reviewed (n)">Next new <kbd>n</kbd></button>
  <span class="grow"></span>
  <span id="progress" class="hint"></span>
  <button id="summarybtn">Summary</button>
</header>
<main id="main"></main>

<script>
const FIELDS = [
  ["persona", "Summary"], ["cultural_background", "Cultural background"], ["professional_persona", "Work and daily life"],
  ["skills_and_expertise", "Skills"], ["hobbies_and_interests", "Hobbies"], ["career_goals_and_ambitions", "Goals"],
  ["sports_persona", "Sports"], ["arts_persona", "Arts and culture"], ["travel_persona", "Travel"],
  ["culinary_persona", "Food"], ["healthcare_persona", "Health"],
];
const ISSUES = [
  ["words", "Odd or invented word"], ["unnatural", "Unnatural Swedish"], ["name_origin", "Name does not fit origin"],
  ["age", "Does not fit age"], ["job", "Does not fit job or education"], ["facts", "Contradicts the facts"],
  ["stereotype", "Stereotype"], ["cliche", "Cliché or repetitive"], ["task", "Task or tool wrong"], ["other", "Other"],
];
const VERDICTS = [["good", "Good", "1"], ["ok", "Okay", "2"], ["bad", "Bad", "3"]];
const $ = (s) => document.querySelector(s);
let D, view = [], pos = 0, filter = "all", saveTimer = null;

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const current = () => D.personas[view[pos]];
const review = (p) => D.reviews[p.uuid] || (D.reviews[p.uuid] = { uuid: p.uuid, verdict: null, issues: [], flags: {}, words: [], note: "" });
const touched = (r) => r && (r.verdict || r.issues.length || Object.keys(r.flags).length || r.words.length || r.note);

function matches(p) {
  const r = D.reviews[p.uuid];
  switch (filter) {
    case "unreviewed": return !touched(r);
    case "reviewed": return !!touched(r);
    case "attention": return r && (r.verdict === "ok" || r.verdict === "bad");
    case "working": return !!p.job_title;
    case "foreign": return p.background !== "inrikes född med två inrikes födda föräldrar";
    case "child": return p.age < 18;
    case "senior": return p.age >= 65;
    default: return true;
  }
}
function rebuild(keepUuid) {
  view = D.personas.map((p, i) => i).filter((i) => matches(D.personas[i]));
  const at = keepUuid ? view.findIndex((i) => D.personas[i].uuid === keepUuid) : -1;
  pos = at >= 0 ? at : Math.min(pos, Math.max(0, view.length - 1));
  render();
}
function save(p) {
  $("#status") && ($("#status").textContent = "saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch("/api/review", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...review(p), savedAt: new Date().toISOString() }) });
      if (!res.ok) throw new Error(res.status);
      $("#status") && ($("#status").textContent = "saved");
    } catch (e) { $("#status") && ($("#status").textContent = "NOT SAVED: is the server still running?"); }
    progress();
  }, 300);
}
function progress() {
  const done = D.personas.filter((p) => touched(D.reviews[p.uuid])).length;
  const counts = { good: 0, ok: 0, bad: 0 };
  for (const r of Object.values(D.reviews)) if (counts[r.verdict] !== undefined) counts[r.verdict]++;
  $("#progress").textContent = `${done} reviewed · ${counts.good} good · ${counts.ok} okay · ${counts.bad} bad`;
}

function facts(p) {
  const chip = (k, v) => v ? h("span", { class: "chip" }, k + " ", h("b", {}, String(v))) : null;
  return h("div", { class: "chips" },
    chip("born", `${p.birth_year} (${p.age} y)`), chip("sex", p.sex), chip("lives in", `${p.kommun}, ${p.lan}`),
    chip("country of birth", p.country_of_birth), chip("parents born in", p.parents_country_of_birth !== p.country_of_birth ? p.parents_country_of_birth : null),
    chip("name group", p.name_heritage), chip("education", p.education_level), chip("status", p.employment_status),
    chip("job group", p.occupation !== "not_in_workforce" ? `${p.occupation} (${p.occupation_code})` : null), chip("industry", p.industry),
    chip("household", p.household_type), chip("marital", p.marital_status),
    chip("conditions", p.conditions.length ? p.conditions.join(", ") : "none"),
  );
}
function fieldBlock(p, key, label) {
  const r = review(p), on = !!r.flags[key];
  const block = h("div", { class: "field" + (on ? " flagged" : ""), "data-field": key },
    h("h3", {}, label, h("button", { class: "flagbtn", title: "Flag this field", onclick: () => { on ? delete r.flags[key] : (r.flags[key] = true); save(p); render(true); } }, on ? "⚑ flagged" : "⚑")),
    h("p", {}, p[key]));
  return block;
}
function workBlock(p) {
  if (!p.job_title) return null;
  const r = review(p), cat = D.catalogue[p.occupation_code];
  const flip = (id) => { const k = "task:" + id; r.flags[k] ? delete r.flags[k] : (r.flags[k] = true); save(p); render(true); };
  return h("div", {},
    h("h2", {}, "Work profile"),
    h("p", {}, h("b", {}, p.job_title), ` · ${p.seniority} · ${p.workplace}`),
    h("p", { class: "lists" }, "Tools: " + p.work_tools.join(", ")),
    h("table", {}, p.work_tasks.map((t) => h("tr", { class: "task" + (r.flags["task:" + t.task_id] ? " flagged" : "") },
      h("td", { class: "num" }, t.share_percent + "%"),
      h("td", {}, t.task, h("div", { class: "detail" }, t.detail)),
      h("td", { class: "tag" }, t.computer_based === "helt" ? "computer" : t.computer_based === "delvis" ? "part computer" : "hands-on"),
      h("td", {}, h("button", { class: "flagbtn", title: "Flag this task", onclick: () => flip(t.task_id) }, "⚑"))))),
    cat && h("details", {}, h("summary", {}, `All ${cat.tasks.length} tasks for this occupation group`),
      h("table", {}, cat.tasks.map((t) => h("tr", {}, h("td", { class: "num" }, t.task_id.split("-")[1]),
        h("td", {}, t.task, h("div", { class: "detail" }, "Tools: " + t.tools.join(", ") + " → " + t.output)),
        h("td", { class: "tag" }, t.computer_based))))));
}
function panel(p) {
  const r = review(p);
  const setV = (v) => { r.verdict = r.verdict === v ? null : v; save(p); render(true); };
  const pick = () => {
    const s = window.getSelection().toString().trim();
    if (s && !r.words.includes(s)) { r.words.push(s); save(p); render(true); }
  };
  return h("aside", {},
    h("div", { class: "card" },
      h("h2", {}, "Your review"),
      h("div", { class: "verdicts" }, VERDICTS.map(([v, label, key]) => h("button", { "data-v": v, class: r.verdict === v ? "sel" : "", onclick: () => setV(v), title: "Key " + key }, `${label} (${key})`))),
      h("h2", {}, "Problems"),
      h("div", { class: "chips" }, ISSUES.map(([k, label]) => h("span", { class: "chip" + (r.issues.includes(k) ? " on" : ""), style: "cursor:pointer",
        onclick: () => { r.issues = r.issues.includes(k) ? r.issues.filter((x) => x !== k) : [...r.issues, k]; save(p); render(true); } }, label))),
      h("h2", {}, "Words and phrases"),
      h("button", { onclick: pick, title: "Key w" }, "Add selected text (w)"),
      h("div", { class: "words" }, r.words.map((w) => h("span", { class: "chip", title: "Click to remove", onclick: () => { r.words = r.words.filter((x) => x !== w); save(p); render(true); } }, w + " ×"))),
      h("p", { class: "hint" }, "Select a word or phrase in the text, then press the button or w."),
      h("h2", {}, "Note"),
      h("textarea", { id: "note", oninput: (e) => { r.note = e.target.value; save(p); } }, r.note),
      h("div", { id: "status", class: "status" }, "")),
    h("div", { class: "hint" }, h("kbd", {}, "←"), " ", h("kbd", {}, "→"), " move · ", h("kbd", {}, "1"), h("kbd", {}, "2"), h("kbd", {}, "3"), " verdict · ", h("kbd", {}, "n"), " next new · ", h("kbd", {}, "w"), " flag selection · ", h("kbd", {}, "f"), " flag a field: click ⚑"));
}
function render(keepScroll) {
  const y = window.scrollY, main = $("#main"), p = view.length ? current() : null;
  main.replaceChildren();
  $("#pos").textContent = view.length ? `${pos + 1} / ${view.length}` : "0 / 0";
  if (!p) { main.append(h("div", { class: "card" }, "No personas match this filter.")); progress(); return; }
  main.append(
    h("div", { class: "card" }, h("h1", {}, `${p.first_name} ${p.last_name}`), h("p", { class: "sub" }, `${p.age} år · ${p.kommun}`), facts(p),
      h("h2", {}, "Text"), FIELDS.map(([k, l]) => fieldBlock(p, k, l)),
      h("p", { class: "lists" }, "Skills: " + p.skills_and_expertise_list.join(" · ")),
      h("p", { class: "lists" }, "Interests: " + p.hobbies_and_interests_list.join(" · ")),
      workBlock(p)),
    panel(p));
  progress();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
function go(d) { if (view.length) { pos = (pos + d + view.length) % view.length; render(); } }
function nextNew() {
  for (let k = 1; k <= view.length; k++) {
    const i = (pos + k) % view.length;
    if (!touched(D.reviews[D.personas[view[i]].uuid])) { pos = i; return render(); }
  }
}
function showSummary() {
  const rs = Object.values(D.reviews).filter(touched), count = (f) => { const c = {}; rs.forEach((r) => f(r).forEach((x) => c[x] = (c[x] || 0) + 1)); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const rows = (pairs, name) => pairs.length ? pairs.map(([k, n]) => h("tr", {}, h("td", {}, name(k)), h("td", {}, String(n)))) : [h("tr", {}, h("td", {}, "none yet"), h("td", {}))];
  const label = Object.fromEntries(ISSUES);
  const main = $("#main"); main.replaceChildren(h("div", { class: "card summary", style: "grid-column:1/-1" },
    h("h1", {}, "Summary"), h("p", { class: "sub" }, `${rs.length} personas reviewed. The same counts, plus every note, come from: python3 src/review_tool.py --summary`),
    h("h2", {}, "Verdicts"), h("table", {}, rows(count((r) => [r.verdict || "none"]), (k) => k)),
    h("h2", {}, "Problems"), h("table", {}, rows(count((r) => r.issues), (k) => label[k] || k)),
    h("h2", {}, "Flagged fields and tasks"), h("table", {}, rows(count((r) => Object.keys(r.flags)), (k) => k)),
    h("h2", {}, "Words and phrases"), h("table", {}, rows(count((r) => r.words), (k) => k)),
    h("p", {}, h("button", { class: "primary", onclick: () => render() }, "Back to reviewing"))));
}
$("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1); $("#nextnew").onclick = nextNew; $("#summarybtn").onclick = showSummary;
$("#filter").onchange = (e) => { filter = e.target.value; rebuild(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey || !view.length) return;
  const p = current(), r = review(p);
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "n") nextNew();
  else if (["1", "2", "3"].includes(e.key)) { const v = VERDICTS[+e.key - 1][0]; r.verdict = r.verdict === v ? null : v; save(p); render(true); }
  else if (e.key === "w") { const s = window.getSelection().toString().trim(); if (s && !r.words.includes(s)) { r.words.push(s); save(p); render(true); } }
});
fetch("/api/data").then((r) => r.json()).then((data) => { D = data; rebuild(); const first = D.personas.findIndex((p) => !touched(D.reviews[p.uuid])); if (first > 0) { pos = view.indexOf(first); render(); } });
</script>
</body>
</html>
